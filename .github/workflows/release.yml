# Release: tag-triggered (v*). Binaries are attached straight to the GitHub
# Release with gh. The one workflow artifact is the packed NuGet package, kept for a
# day: the organization's central publish workflow pushes it (this repository holds no
# NuGet credential).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # gh release create

jobs:
  release:
    runs-on: ubuntu-latest
    # Same live-DB service containers as ci.yml's `integration` job — release
    # gating must be at least as strong as CI, or a contract regression that
    # only a live-DB test catches can slip through a green release (see the
    # v0.11.0 post-release PostgresCliTests incident).
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: Schemorph_CI_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Schemorph_CI_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: Schemorph_CI_2026
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      # The engine the provider targets. The tests that need an 18 server skip on 16, so release gating runs the
      # Postgres suite against both, as ci.yml's `postgres-18` job does.
      postgres18:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: Schemorph_CI_2026
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Resolve version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # Same R1-baseline restricted role as ci.yml — a permissive superuser
      # would skip the scratch-schema path the provider actually ships.
      - name: Create the restricted Postgres role
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U postgres
          -c "CREATE ROLE schemorph_ci LOGIN PASSWORD 'ci' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          -c "CREATE DATABASE schemorph_ci OWNER schemorph_ci;"
          && docker exec ${{ job.services.postgres18.id }} psql -U postgres
          -c "CREATE ROLE schemorph_ci LOGIN PASSWORD 'ci' NOSUPERUSER NOCREATEDB NOCREATEROLE;"
          -c "CREATE DATABASE schemorph_ci OWNER schemorph_ci;"

      - name: Postgres provider tests against 18
        env:
          SCHEMORPH_PG_TEST_URL: Host=localhost;Port=5433;Username=schemorph_ci;Password=ci;Database=schemorph_ci
        run: dotnet test tests/Schemorph.Provider.Postgres.Tests -c Release

      - name: Test
        env:
          SCHEMORPH_TEST_URL: Server=localhost,1433;User ID=sa;Password=Schemorph_CI_2026!;Encrypt=False;TrustServerCertificate=True
          SCHEMORPH_PG_TEST_URL: Host=localhost;Port=5432;Username=schemorph_ci;Password=ci;Database=schemorph_ci
        run: dotnet test -c Release

      - name: Pack dotnet tool
        run: dotnet pack src/Schemorph.Cli -c Release -p:Version=$VERSION -o packages

      # ADR-0001: self-contained, un-trimmed, single-file self-extract (no AOT),
      # so every RID cross-publishes from Linux.
      - name: Publish binaries
        run: |
          for rid in win-x64 linux-x64 osx-arm64; do
            dotnet publish src/Schemorph.Cli -c Release -r "$rid" --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:Version=$VERSION -o "publish/$rid"
          done
          mkdir dist
          (cd publish/win-x64  && zip -q ../../dist/schemorph-$VERSION-win-x64.zip schemorph.exe)
          tar -C publish/linux-x64 -czf dist/schemorph-$VERSION-linux-x64.tar.gz schemorph
          tar -C publish/osx-arm64 -czf dist/schemorph-$VERSION-osx-arm64.tar.gz schemorph

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* packages/*.nupkg \
            --title "schemorph $VERSION" --generate-notes

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            packages/*.nupkg
            packages/*.snupkg
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: release
    uses: iyulab/nuget-publish/.github/workflows/request.yml@de1e58c8bcefaf88f497fcb58899a1c6e84f4e29 # main
    permissions: {}
    secrets: inherit
